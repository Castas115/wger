apiVersion: apps/v1
kind: Deployment
metadata:
  name: wger
  namespace: wger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wger
  template:
    metadata:
      labels:
        app: wger
    spec:
      enableServiceLinks: false
      initContainers:
        - name: ca-bundle
          image: wger/server:latest
          command: ["sh", "-c"]
          args:
            - |
              python3 -c "import certifi; print(certifi.where())" > /tmp/certifi-path
              cat "$(cat /tmp/certifi-path)" /ca-source/home-ca.crt > /ca-bundle/cacert.pem
          volumeMounts:
            - { name: ca-source, mountPath: /ca-source, readOnly: true }
            - { name: ca-bundle, mountPath: /ca-bundle }
        - name: patch-max-duration
          image: wger/server:latest
          command: ["sh", "-c"]
          args:
            - |
              sed 's/MAX_DURATION_DAYS = 120/MAX_DURATION_DAYS = 730/' \
                /home/wger/src/wger/manager/models/routine.py > /patched/routine.py
          volumeMounts:
            - { name: patched-routine, mountPath: /patched }
      containers:
        - name: web
          image: wger/server:latest
          envFrom:
            - configMapRef: { name: wger-config }
            - secretRef: { name: wger-secrets }
          env:
            - { name: REQUESTS_CA_BUNDLE, value: /ca-bundle/cacert.pem }
          volumeMounts:
            - { name: static, mountPath: /home/wger/static }
            - { name: media, mountPath: /home/wger/media }
            - { name: ca-bundle, mountPath: /ca-bundle, readOnly: true }
            - { name: patched-routine, mountPath: /home/wger/src/wger/manager/models/routine.py, subPath: routine.py }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 1Gi }
        - name: nginx
          image: nginx:stable
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
            - { name: static, mountPath: /wger/static, readOnly: true }
            - { name: media, mountPath: /wger/media, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - { name: static, emptyDir: {} }
        - { name: ca-bundle, emptyDir: {} }
        - { name: patched-routine, emptyDir: {} }
        - name: ca-source
          configMap:
            name: wger-ca-cert
        - name: media
          persistentVolumeClaim:
            claimName: wger-media
        - name: nginx-conf
          configMap:
            name: wger-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: wger
  namespace: wger
spec:
  selector:
    app: wger
  ports:
    - { port: 80, targetPort: 80 }
