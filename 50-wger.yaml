apiVersion: apps/v1
kind: Deployment
metadata:
  name: wger
  namespace: wger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wger
  template:
    metadata:
      labels:
        app: wger
    spec:
      enableServiceLinks: false
      containers:
        - name: web
          image: wger/server:latest
          envFrom:
            - configMapRef: { name: wger-config }
            - secretRef: { name: wger-secrets }
          volumeMounts:
            - { name: static, mountPath: /home/wger/static }
            - { name: media, mountPath: /home/wger/media }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 1Gi }
        - name: nginx
          image: nginx:stable
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
            - { name: static, mountPath: /wger/static, readOnly: true }
            - { name: media, mountPath: /wger/media, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - { name: static, emptyDir: {} }
        - name: media
          persistentVolumeClaim:
            claimName: wger-media
        - name: nginx-conf
          configMap:
            name: wger-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: wger
  namespace: wger
spec:
  selector:
    app: wger
  ports:
    - { port: 80, targetPort: 80 }
