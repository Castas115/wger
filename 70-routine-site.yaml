# Serves routine.html (generated from program.yaml via scripts/render_routine.py)
# as a static page. The ConfigMap is built from routine.html by kustomize's
# configMapGenerator below, so every commit that changes routine.html gets a
# new ConfigMap hash -> new rollout, automatically, on the next ArgoCD sync.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workout-routine
  namespace: wger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workout-routine
  template:
    metadata:
      labels:
        app: workout-routine
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          volumeMounts:
            - { name: html, mountPath: /usr/share/nginx/html/index.html, subPath: routine.html, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: html
          configMap:
            name: workout-routine-html
---
apiVersion: v1
kind: Service
metadata:
  name: workout-routine
  namespace: wger
spec:
  selector:
    app: workout-routine
  ports:
    - { port: 80, targetPort: 80 }
