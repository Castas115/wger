<title>Weekly Split</title>

<style>
:root{
  --bg:#f5f3ef; --surface:#ffffff; --surface-2:#ececE4; --ink:#1c1a17; --ink-dim:#6b6558;
  --rule:#ddd8cd; --accent:#c4531d; --assist:#2f6f6b; --acc2:#8a7a3f; --acc3:#5a5f8a;
  --pat-push:#c4531d; --pat-pull:#2f6f6b; --pat-leg:#8a7a3f; --pat-hinge:#5a5f8a; --pat-arm:#9c4a76; --pat-core:#6b6558;
  --mono:'JetBrains Mono',ui-monospace,monospace; --display:'Oswald',sans-serif; --body:'Inter',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15130f; --surface:#1e1b16; --surface-2:#262219; --ink:#f1ede4; --ink-dim:#a39b89;
    --rule:#352f24; --accent:#e37a3a; --assist:#5fb3ac; --acc2:#c9b05f; --acc3:#8c91c2;
    --pat-push:#e37a3a; --pat-pull:#5fb3ac; --pat-leg:#c9b05f; --pat-hinge:#8c91c2; --pat-arm:#d980ae; --pat-core:#a39b89;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);padding:0 16px 40px}
h1,h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.wrap{max-width:1180px;margin:0 auto}
header{padding:26px 0 18px}
header .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
header h1{font-size:clamp(24px,4vw,34px);margin-top:4px}
header p{margin:6px 0 0;color:var(--ink-dim);font-size:13px;max-width:70ch}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}

.day{background:var(--surface);border:1px solid var(--rule);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.day-head{padding:14px 16px;border-bottom:1px solid var(--rule);background:var(--surface-2)}
.day-head .num{font-family:var(--mono);font-size:11px;color:var(--ink-dim);letter-spacing:.08em;text-transform:uppercase}
.day-head h2{font-size:17px;margin-top:2px}
.day-head .focus{font-size:12px;color:var(--ink-dim);margin-top:2px}

.exlist{list-style:none;margin:0;padding:8px 0;flex:1}
.ex{border-bottom:1px solid var(--rule)}
.ex:not(details){padding:9px 16px;display:flex;flex-direction:column;gap:2px}
.exlist li:last-child .ex{border-bottom:none}
.ex.main{border-left:3px solid var(--accent)}
.ex.assist{border-left:3px solid var(--assist)}
.ex.accessory{border-left:3px solid var(--acc2)}
.ex .pattern{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim)}
.ex .pattern.pat-push{color:var(--pat-push)}
.ex .pattern.pat-pull{color:var(--pat-pull)}
.ex .pattern.pat-leg{color:var(--pat-leg)}
.ex .pattern.pat-hinge{color:var(--pat-hinge)}
.ex .pattern.pat-arm{color:var(--pat-arm)}
.ex .pattern.pat-core{color:var(--pat-core)}
.ex .name{font-size:13.5px;font-weight:500}
.ex .spec{font-family:var(--mono);font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums}

.legend{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 18px;font-family:var(--mono);font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend i.main{background:var(--accent)}
.legend i.assist{background:var(--assist)}
.legend i.accessory{background:var(--acc2)}

.ex[open]{background:var(--surface-2)}
.ex summary{list-style:none;cursor:pointer;padding:9px 16px;display:flex;align-items:center;gap:10px}
.ex summary::-webkit-details-marker{display:none}
.ex summary .fields{display:flex;flex-direction:column;gap:2px;flex:1}
.ex summary .chev{font-family:var(--mono);font-size:11px;color:var(--ink-dim);transition:transform .15s}
.ex[open] summary .chev{transform:rotate(90deg)}
.prog{padding:0 16px 10px}
.prog table{border-collapse:collapse;width:100%}
.prog th,.prog td{font-family:var(--mono);font-size:10.5px;padding:3px 5px;text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.prog th{color:var(--ink-dim);font-weight:500;text-transform:uppercase;letter-spacing:.04em;font-size:9px}
.prog td.blk{color:var(--ink-dim);font-family:var(--body)}
.prog tr+tr td{border-top:1px solid var(--rule)}

footer{margin-top:28px;color:var(--ink-dim);font-size:11px;font-family:var(--mono);border-top:1px solid var(--rule);padding-top:12px}
</style>
</head>

function rpeClass(cell){
  const m = cell.match(/@([\d.]+)/);
  if(!m) return '';
  const v = parseFloat(m[1]);
  if(v>=10) return 'r10';
  if(v>=8) return 'r8';
  if(v>=7) return 'r7';
  return 'r65';
}
function fmtCell(cell){
  const m = cell.match(/^(.*)@([\d.]+)$/);
  if(!m) return cell;
  return `${m[1].trim()}<span class="rpe ${rpeClass(cell)}">@${m[2]}</span>`;
}
function patClass(pattern){
  return 'pat-' + pattern.split(' ')[0].toLowerCase();
}

function progTable(e){
  const weeks = ['W1','W2','W3','W4'];
  const rows = Object.entries(e.blocks).map(([bk,b]) => {
    const cell = e.kind === "main"
      ? weeks.map(w => {
          const topW = b.top_set_weight && b.top_set_weight[w] != null ? ` · ${b.top_set_weight[w]}kg` : '';
          const backW = b.backoff_weight && b.backoff_weight[w] != null ? ` · ${b.backoff_weight[w]}kg` : '';
          return `<td>${b.top_set[w].split(' @')[0]}${topW}<br>${b.backoff[w]}${backW}</td>`;
        }).join('')
      : weeks.map(w => `<td>${b.work[w]}</td>`).join('');
    return `<tr><td class="blk">${bk}</td>${cell}</tr>`;
  }).join('');
  return `<table><thead><tr><th>Blk</th><th>W1</th><th>W2</th><th>W3</th><th>W4</th></tr></thead><tbody>${rows}</tbody></table>`;
}

const grid = document.getElementById('grid');
DAYS.forEach(day => {
  const col = document.createElement('div');
  col.className = 'day';
  col.innerHTML = `
    <div class="day-head">
      <div class="num">${day.num}</div>
      <h2>${day.name}</h2>
      <div class="focus">${day.focus}</div>
    </div>
    <ul class="exlist">
      ${day.exercises.map(e => e.blocks ? `
        <li><details class="ex ${e.role}">
          <summary>
            <span class="fields">
              <span class="pattern ${patClass(e.pattern)}">${e.pattern}</span>
              <span class="name">${e.name}</span>
              <span class="spec">${e.spec}</span>
            </span>
            <span class="chev">▸</span>
          </summary>
          <div class="prog">${progTable(e)}</div>
        </details></li>
      ` : `
        <li><div class="ex ${e.role}">
          <span class="pattern ${patClass(e.pattern)}">${e.pattern}</span>
          <span class="name">${e.name}</span>
          <span class="spec">${e.spec}</span>
        </div></li>
      `).join('')}
    </ul>`;
  grid.appendChild(col);
});
</script>
</body>
</html>
