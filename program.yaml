        wger_exercise_id: 154
        kind: work
        blocks:
          B1: { work: { W1: "2x8-10 @7", W2: "3x8-10 @8", W3: "3x8-10 @8", W4: "3x8-10 @8" } }
          B2: { work: { W1: "3x7-9 @7",  W2: "4x7-9 @8",  W3: "4x7-9 @8",  W4: "4x7-9 @8" } }
          B3: { work: { W1: "3x6-8 @7",  W2: "4x6-8 @8",  W3: "4x6-8 @8",  W4: "4x6-8 @8" } }
          B4: { work: { W1: "4x5-7 @7",  W2: "5x5-7 @8",  W3: "5x5-7 @8",  W4: "5x5-7 @8" } }
          B5: { work: { W1: "4x8 @7",    W2: "5x7 @8",    W3: "5x6 @8",    W4: "5x5 @8" } }
      - key: assist_2
        role: assist
        pattern: "Push · Horizontal"
        name: "DB incline bench press"
        wger_name: "Incline Bench Press - Dumbbell"
        wger_exercise_id: 537
        kind: work
        blocks:
          B1: { work: { W1: "2x9-15 @7", W2: "3x9-15 @8", W3: "3x9-15 @8", W4: "3x9-15 @8" } }
          B2: { work: { W1: "2x9-15 @7", W2: "3x9-15 @8", W3: "3x9-15 @8", W4: "3x9-15 @8" } }
          B3: { work: { W1: "2x9-15 @7", W2: "3x9-15 @8", W3: "3x9-15 @8", W4: "3x9-15 @8" } }
          B4: { work: { W1: "2x9-15 @7", W2: "3x9-15 @8", W3: "3x9-15 @8", W4: "3x9-15 @8" } }
          B5: { work: { W1: "2x9-15 @7", W2: "3x9-15 @8", W3: "3x9-15 @8", W4: "3x9-15 @8" } }
      - key: arms_biceps
        role: accessory
