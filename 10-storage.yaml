apiVersion: v1
kind: PersistentVolume
metadata:
  name: wger-postgres
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: wger
    name: wger-postgres
  hostPath:
    path: /opt/wger/postgres
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["pc2"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wger-postgres
  namespace: wger
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ""
  volumeName: wger-postgres
  resources:
    requests:
      storage: 5Gi
---
