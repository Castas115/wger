apiVersion: apps/v1
kind: Deployment
metadata:
  name: wger-redis
  namespace: wger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wger-redis
  template:
    metadata:
      labels:
        app: wger-redis
    spec:
      containers:
        - name: redis
          image: redis:alpine
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: wger-redis
  namespace: wger
spec:
  selector:
    app: wger-redis
  ports:
    - { port: 6379, targetPort: 6379 }
